name: Conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact subject
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Prepare CI workspace
        run: mkdir -p .ci/bin .ci/timing

      - name: Gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"

      - name: Go vet
        run: go vet ./...

      - name: Build and measure
        run: ./scripts/measure-command.sh .ci/timing/build.json -- go build -trimpath -o .ci/bin/gooo-self-rewrite-sandbox ./cmd/gooo-self-rewrite-sandbox

      - name: Test and measure
        run: ./scripts/measure-command.sh .ci/timing/test.json -- bash -c 'go test -json ./... > .ci/test.json'

      - name: Actuation conformance and measure
        run: ./scripts/measure-command.sh .ci/timing/conformance.json -- ./scripts/ci-conformance.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/bin/gooo-self-rewrite-sandbox"

      - name: Write exact integer metrics
        run: ./scripts/write-metrics.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/ci-metrics.json"

      - name: Assert evidence is complete
        run: |
          jq -e '
            (.inventory.go_files | type == "number" and floor == .) and
            (.inventory.gooo_files | type == "number" and floor == .) and
            (.inventory.go_physical_lines | type == "number" and floor == .) and
            (.inventory.gooo_physical_lines | type == "number" and floor == .) and
            (.inventory.regular_files | type == "number" and floor == .) and
            (.inventory.files_total | type == "number" and floor == .) and
            (.inventory.subdirectories | type == "number" and floor == .) and
            (.inventory.root_readme_inventory_excluded == 1) and
            (.generated_artifacts.files | type == "number" and floor == .) and
            (.generated_artifacts.bytes | type == "number" and floor == .) and
            (.wall_ms.compile | type == "number" and floor == .) and
            (.wall_ms.build | type == "number" and floor == .) and
            (.wall_ms.test | type == "number" and floor == .) and
            (.wall_ms.conformance | type == "number" and floor == .) and
            (.peak_rss_kib | type == "number" and floor == .) and
            (.tests.total == .tests.selected) and
            (.tests.executed + .tests.failed == .tests.total) and
            (.tests.reused == 0) and
            (.tests.unknown == 1) and
            (.repository_writes == 0) and
            (.automatic_commit_push_merge == 0)
          ' .ci/ci-metrics.json >/dev/null

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-rewrite-sandbox-${{ github.sha }}
          path: .ci
          include-hidden-files: true
