name: Immutable release

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact merged main commit to release
        required: true
        type: string
      release_version:
        description: New unused 0.x.y version; failed releases are never reused
        required: true
        default: '0.1.0'
        type: string

permissions:
  contents: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_VERSION: ${{ inputs.release_version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact merged commit
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Go 1.27
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'

      - name: Bind release subject
        run: |
          set -euo pipefail
          case "$RELEASE_VERSION" in
            0.*.*) ;;
            *) echo 'release_version must be a 0.x.y version' >&2; exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          RELEASE_TAG="v$RELEASE_VERSION"
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"

      - name: Refuse an existing tag or release
        run: |
          set -euo pipefail
          immutable=$(gh api "repos/$GITHUB_REPOSITORY/immutable-releases" --jq '.enabled')
          test "$immutable" = true
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to reuse existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          status=$(gh api --include "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" 2>/dev/null | awk 'NR == 1 {print $2}') || true
          test -z "$status" || test "$status" = 404

      - name: Re-run CI evidence on exact subject
        run: |
          set -euo pipefail
          test -z "$(gofmt -l $(git ls-files '*.go'))"
          go vet ./...
          mkdir -p .ci/bin .ci/timing
          ./scripts/measure-command.sh .ci/timing/build.json -- go build -trimpath -o .ci/bin/gooo-self-rewrite-sandbox ./cmd/gooo-self-rewrite-sandbox
          ./scripts/measure-command.sh .ci/timing/test.json -- bash -c 'go test -json ./... > .ci/test.json'
          ./scripts/measure-command.sh .ci/timing/conformance.json -- ./scripts/ci-conformance.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/bin/gooo-self-rewrite-sandbox"
          ./scripts/write-metrics.sh "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/.ci" "$GITHUB_WORKSPACE/.ci/ci-metrics.json"
          jq -e '.decision == "CLOSED" and .repository_writes == 0 and .automatic_commit_push_merge == 0 and ([.cases[] | .match] | all)' .ci/conformance-report.json >/dev/null

      - name: Assemble release assets
        run: |
          set -euo pipefail
          mkdir -p .ci/release
          source_name="gooo-self-rewrite-sandbox-source-v${RELEASE_VERSION}.tar.gz"
          binary_name="gooo-self-rewrite-sandbox-linux-amd64-v${RELEASE_VERSION}.tar.gz"
          report_name="release-report-v${RELEASE_VERSION}.json"
          manifest_name="release-manifest-v${RELEASE_VERSION}.json"
          git archive --format=tar.gz --prefix="gooo-self-rewrite-sandbox-v${RELEASE_VERSION}/" "$EXPECTED_SHA" > ".ci/release/$source_name"
          tar -czf ".ci/release/$binary_name" -C .ci/bin gooo-self-rewrite-sandbox
          jq -n --arg schema "gooo/self-rewrite-release-report/v1" --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" \
            --slurpfile conformance .ci/conformance-report.json --slurpfile metrics .ci/ci-metrics.json --slurpfile oracle contracts/oracle-lock-v1.json \
            '{schema:$schema,version:$version,tag:$tag,commit:$commit,scope:"PROMOTION_FREE_SELF_REWRITE_ACTUATION",conformance:$conformance[0],metrics:$metrics[0],optional_oracle_lock:$oracle[0]}' \
            > ".ci/release/$report_name"
          jq -n --arg schema "gooo/self-rewrite-release/v1" --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" \
            '{schema:$schema,version:$version,tag:$tag,commit:$commit,authority:"meta/self-rewrite-boundary.gooo",promotion_authority:false,input_repository_writes:0,automatic_commit_push_merge:0}' \
            > .ci/release/version.json
          source_digest="sha256:$(sha256sum ".ci/release/$source_name" | awk '{print $1}')"
          binary_digest="sha256:$(sha256sum ".ci/release/$binary_name" | awk '{print $1}')"
          report_digest="sha256:$(sha256sum ".ci/release/$report_name" | awk '{print $1}')"
          version_digest="sha256:$(sha256sum .ci/release/version.json | awk '{print $1}')"
          jq -n --arg schema "gooo/self-rewrite-release-manifest/v1" --arg version "$RELEASE_VERSION" --arg tag "$RELEASE_TAG" --arg commit "$EXPECTED_SHA" \
            --arg source "$source_digest" --arg binary "$binary_digest" --arg report "$report_digest" --arg version_digest "$version_digest" \
            --arg source_name "$source_name" --arg binary_name "$binary_name" --arg report_name "$report_name" \
            '{schema:$schema,version:$version,tag:$tag,commit:$commit,assets:[{name:$source_name,digest:$source},{name:$binary_name,digest:$binary},{name:$report_name,digest:$report},{name:"version.json",digest:$version_digest}]}' \
            > ".ci/release/$manifest_name"
          (cd .ci/release && sha256sum "$source_name" "$binary_name" "$report_name" version.json "$manifest_name" > SHA256SUMS)
          (cd .ci/release && sha256sum -c SHA256SUMS)
          test "$(find .ci/release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 6
          jq -n --arg source_name "$source_name" --arg source_digest "$source_digest" --argjson source_size "$(stat -c '%s' ".ci/release/$source_name")" \
            --arg binary_name "$binary_name" --arg binary_digest "$binary_digest" --argjson binary_size "$(stat -c '%s' ".ci/release/$binary_name")" \
            --arg report_name "$report_name" --arg report_digest "$report_digest" --argjson report_size "$(stat -c '%s' ".ci/release/$report_name")" \
            --arg manifest_name "$manifest_name" --arg manifest_digest "sha256:$(sha256sum ".ci/release/$manifest_name" | awk '{print $1}')" --argjson manifest_size "$(stat -c '%s' ".ci/release/$manifest_name")" \
            --arg sums_digest "sha256:$(sha256sum .ci/release/SHA256SUMS | awk '{print $1}')" --argjson sums_size "$(stat -c '%s' .ci/release/SHA256SUMS)" \
            --arg version_digest "$version_digest" --argjson version_size "$(stat -c '%s' .ci/release/version.json)" \
            '[{name:$source_name,size:$source_size,digest:$source_digest},{name:$binary_name,size:$binary_size,digest:$binary_digest},{name:$report_name,size:$report_size,digest:$report_digest},{name:$manifest_name,size:$manifest_size,digest:$manifest_digest},{name:"SHA256SUMS",size:$sums_size,digest:$sums_digest},{name:"version.json",size:$version_size,digest:$version_digest}] | sort_by(.name)' \
            > .ci/expected-release-assets.json

      - name: Create annotated tag exactly once
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "refusing to rewrite existing tag $RELEASE_TAG" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$EXPECTED_SHA" -m "gooo-self-rewrite-sandbox $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null

      - name: Publish release exactly once
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "gooo-self-rewrite-sandbox $RELEASE_TAG" \
            --notes 'Immutable evidence-bounded release. Candidates are generated and executed in caller-owned temporary space; promotion remains unavailable.' \
            .ci/release/*

      - name: Verify immutable release, tag, and asset digests
        run: |
          set -euo pipefail
          release_json=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG")
          jq -e --arg tag "$RELEASE_TAG" --slurpfile expected .ci/expected-release-assets.json '
            .draft == false and .prerelease == false and .immutable == true and .tag_name == $tag and
            ([.assets[] | {name,size,digest}] | sort_by(.name)) == ($expected[0] | sort_by(.name))
          ' <<<"$release_json" >/dev/null
          tag_ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")
          test "$(jq -r '.object.type' <<<"$tag_ref")" = tag
          tag_object=$(jq -r '.object.sha' <<<"$tag_ref")
          tag_body=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object")
          jq -e --arg expected "$EXPECTED_SHA" '.object.type == "commit" and .object.sha == $expected' <<<"$tag_body" >/dev/null
